version: '3.8'

services:
  # ============================================================================
  # 1. Base de Datos (PostgreSQL)
  # ============================================================================
  postgres-db:
    image: postgres:15-alpine
    container_name: cobro_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: prueba
      POSTGRES_PASSWORD: adminprueba!BB
      POSTGRES_DB: cobro_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prueba -d cobro_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      default:
        aliases:
          - postgres-db.supabase.co

  # ============================================================================
  # 2. Backend API (NestJS + Prisma)
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: cobro_backend
    restart: unless-stopped
    environment:
      NODE_ENV: "development"
      # Forzamos al servidor a escuchar en 0.0.0.0 para que el puerto expuesto en Docker funcione
      HOST: "0.0.0.0"
      DATABASE_URL: "postgresql://prueba:adminprueba!BB@postgres-db.supabase.co:5432/cobro_db?schema=public"
      # JWT Secret
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:-clave_secreta_por_defecto_123}
      # Credenciales para el administrador inicial
      ADMIN_USERNAME: "prueba"
      ADMIN_PASSWORD: "adminprueba!BB"
      ADMIN_EMAIL: "admin@demo.com"
      ADMIN_ROLE: "ADMINISTRADOR"
    ports:
      - "3000:3000"
    # Ejecutamos db push y llamamos directamente al seed compilado ya que npx prisma db seed falla por config
    command: ["sh", "-c", "npx prisma db push --accept-data-loss && node dist/prisma/seed.js && node dist/src/main.js"]
    # Dependencia estricta: El backend no iniciará hasta que postgres-db pase su healthcheck
    depends_on:
      postgres-db:
        condition: service_healthy

  # ============================================================================
  # 3. Frontend Cliente (Flutter Web + Nginx)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: cobro_frontend
    restart: unless-stopped
    ports:
      # Mapeamos el puerto 8081 del host al puerto 80 del contenedor Nginx
      - "8081:80"
    depends_on:
      - backend

# ==============================================================================
# Declaración de Volúmenes
# ==============================================================================
volumes:
  pgdata:
    name: cobro_pg_data
