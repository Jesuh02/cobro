name: cobro_app
description: Multiplatform Flutter client for the Cobro API.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  fl_chart: ^1.2.0
  geolocator: ^14.0.3
  http: ^1.2.2
  latlong2: ^0.9.1
  mapcn_flutter: ^1.0.2

dependency_overrides:
  mapcn_flutter:
    path: vendor/mapcn_flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
